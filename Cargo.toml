[package]
name = "clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
# GTK4 UI
gtk4 = "0.11"

# Clipboard + input
arboard = { version = "3", features = ["wayland-data-control"] }
enigo = "0.6"

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
parking_lot = "0.12"
